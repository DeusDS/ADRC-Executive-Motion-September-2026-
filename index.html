<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADRC Executive Dashboard, FY2027: explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=DM+Mono&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#1C1304; --navy:#04132E; --gold:#C8A04A; --paper:#F6F4EF; --line:#d9d4c8; }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Source Sans 3", system-ui, sans-serif }
.adrc-explainer { max-width:1200px; margin:0 auto; padding:24px 16px 32px }
.adrc-frame { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:10px; background:var(--paper); box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(0,0,0,.08); cursor:pointer }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif; --sans:"Source Sans 3", system-ui, sans-serif; --mono:"DM Mono", ui-monospace, monospace }
#stage .scene { position:absolute; inset:0; visibility:hidden }
#stage .scene.on { visibility:visible }
.adrc-bar { display:flex; align-items:center; gap:14px; margin-top:12px }
.adrc-btn { flex:none; width:44px; height:44px; border-radius:50%; border:0; background:var(--navy); color:var(--paper); display:grid; place-items:center; cursor:pointer }
.adrc-sound { background:transparent; color:var(--navy); border:2px solid var(--navy) }
.adrc-sound[aria-pressed="true"] { background:var(--navy); color:var(--paper) }
.adrc-btn svg { width:18px; height:18px; fill:currentColor }
.adrc-btn:focus-visible, .adrc-range:focus-visible { outline:3px solid var(--gold); outline-offset:3px }
.adrc-track { position:relative; flex:1; height:44px; display:flex; align-items:center }
.adrc-range { width:100%; margin:0; accent-color:var(--navy); cursor:pointer }
.adrc-time { flex:none; font-family:"DM Mono", ui-monospace, monospace; font-size:14px; font-variant-numeric:tabular-nums; min-width:88px; text-align:right }
.adrc-chapters { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; padding:0; list-style:none }
.adrc-chapters button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer }
.adrc-chapters button[aria-current="true"] { background:var(--navy); border-color:var(--navy); color:var(--paper) }
.adrc-chapters button:focus-visible { outline:3px solid var(--gold); outline-offset:2px }
.adrc-transcript { margin-top:18px; font-size:16px; line-height:1.5; max-width:72ch }
.adrc-transcript summary { cursor:pointer; font-weight:700 }
.adrc-transcript ol { padding-left:1.2em }
</style>
<style id="film-css">
#stage { --ground:#F6F4EF; --main:#04132E; --second:#1C1304; --accent:#C8A04A; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:120px; line-height:.98; font-weight:700; color:var(--main); letter-spacing:-.005em }
.sub { font-size:40px; line-height:1.3; font-weight:400; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }
.tag { font-family:var(--mono, ui-monospace, monospace); font-size:26px; letter-spacing:.14em; text-transform:uppercase; color:color-mix(in srgb, var(--accent) 70%, var(--second)) }
.fig { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums; font-weight:400; color:var(--main) }
.big { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:220px; line-height:.9; color:var(--main) }
.lab { font-family:var(--mono, ui-monospace, monospace); font-size:24px; letter-spacing:.1em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 62%, var(--ground)) }
.rule { position:absolute; height:6px; background:var(--accent); border-radius:3px; transform-origin:0 50% }
.bar { position:absolute; bottom:0; background:var(--main); border-radius:6px 6px 0 0; transform-origin:50% 100% }
.bar.now { background:var(--accent) }
.std { position:absolute; height:0; border-top:4px dashed color-mix(in srgb, var(--second) 75%, var(--ground)); transform-origin:0 50% }
.cal { position:absolute }
.cal-sheet { position:absolute; inset:0; background:color-mix(in srgb, var(--ground) 90%, var(--second)); border-radius:.08em }
.cal-page { position:absolute; inset:0; overflow:hidden; background:var(--ground); border:3px solid color-mix(in srgb, var(--second) 16%, var(--ground)); border-radius:.08em; box-shadow:0 12px 30px rgba(0,0,0,.12); display:flex; flex-direction:column; align-items:center; transform-origin:50% 0 }
.cal-head { width:100%; height:24%; background:var(--main); color:var(--ground); font-family:var(--mono, ui-monospace, monospace); font-size:.42em; letter-spacing:.2em; display:flex; align-items:center; justify-content:center }
.cal-num { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:1.9em; line-height:1; margin-top:.12em; color:var(--main); font-variant-numeric:tabular-nums }
.cal-day { font-family:var(--mono, ui-monospace, monospace); font-size:.3em; letter-spacing:.2em; color:color-mix(in srgb, var(--second) 62%, var(--ground)) }
.cal-shade { position:absolute; inset:0; background:var(--second); opacity:0; pointer-events:none }
.cal-ring { position:absolute; top:-.12em; width:.1em; height:.3em; border-radius:.05em; background:color-mix(in srgb, var(--second) 70%, var(--ground)) }
.col { position:absolute; left:150px; top:300px; width:540px } .col .line { font-size:100px }
.gridl { position:absolute; height:2px; background:color-mix(in srgb, var(--second) 10%, var(--ground)); transform-origin:0 50% }
.axis { position:absolute; height:3px; background:color-mix(in srgb, var(--second) 40%, var(--ground)); transform-origin:0 50% }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
.trace { fill:none; stroke:var(--main); stroke-width:8; stroke-linecap:round; stroke-linejoin:round }
.dot { fill:var(--ground); stroke:var(--main); stroke-width:6 } .dot.now { stroke:var(--accent); fill:var(--accent) }
.leader { fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round }
.callout { position:absolute; display:flex; flex-direction:column; gap:8px; padding:20px 26px; background:var(--main); color:var(--ground); border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.18); transform-origin:50% 100% }
.callout-k { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent) }
.callout-v { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:60px; line-height:1 }
.val { position:absolute; font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums; font-size:36px; color:var(--main); text-align:center }
</style>
</head>
<body>
<figure class="adrc-explainer" aria-labelledby="adrc-cap">
  <div class="adrc-frame" id="frame" role="img" aria-label="Animated explainer of the ADRC Executive Dashboard, FY2027. Full text below.">
    <div id="stage"></div>
  </div>
  <div class="adrc-bar">
    <button class="adrc-btn" id="play" type="button" aria-label="Play"></button>
    <div class="adrc-track"><input class="adrc-range" id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Seek"></div>
    <span class="adrc-time" id="time">0:00 / 0:30</span>
    <button class="adrc-btn adrc-sound" id="sound" type="button" aria-pressed="false" aria-label="Turn sound on"></button>
  </div>
  <ul class="adrc-chapters" id="chapters" aria-label="Chapters"></ul>
  <figcaption id="adrc-cap">
    <details class="adrc-transcript">
      <summary>Read the explainer as text</summary>
      <ol>
        <li><strong>ADRC Executive Dashboard, FY2027.</strong> Monthly performance on responsiveness, demand and capacity.</li>
        <li><strong>Days to return a call.</strong> Average business days to return a call: 9 in July, 9 in August, 6 in September, against the DAS standard of 2 days. Lower is better.</li>
        <li><strong>Calls in the queue.</strong> Callbacks still in the list at month-end: 512 in July, 386 in August, 1,021 on September 30. Lower is better.</li>
        <li><strong>Interactions handled.</strong> Total contacts: 7,765 in July, 7,689 in August, 6,825 in September. September: 4,612 serviced interactions, 1,916 web intakes, 149 information emails, 148 APS, MAC and walk-ins.</li>
        <li><strong>Capacity and staffing.</strong> Calls over capacity per business day: 127 in July, 178 in August, 151 in September. FTEs on the phone queue: 7.4, 7.4 and 8.07.</li>
        <li><strong>One monthly view for leadership.</strong> Atlanta Regional Commission, Aging &amp; Independence Services.</li>
      </ol>
    </details>
  </figcaption>
</figure>
<script>
(function () {
  'use strict';
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const K = {
    W: 1920, H: 1080,
    clamp01, seg: (t, a, b) => clamp01((t - a) / (b - a)), lerp: (a, b, p) => a + (b - a) * p,
    eo: x => 1 - Math.pow(1 - clamp01(x), 3), ei: x => Math.pow(clamp01(x), 3),
    eio: x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    eob: (x, s = 1.4) => { x = clamp01(x) - 1; return 1 + (s + 1) * x * x * x + s * x * x; },
    breathe: (t, amt = .012, period = 3.2) => 1 + amt * Math.sin(2 * Math.PI * t / period),
    h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; },
  };
  K.TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {}; const st = o.stagger ?? .11, dur = o.dur ?? .5, dx = o.dx ?? 26;
      if (!el._w) {
        const words = el.textContent.split(' '); el.textContent = '';
        el._w = words.map((w, i) => { const s = document.createElement('span'); s.textContent = w; s.style.display = 'inline-block'; el.append(s); if (i < words.length - 1) el.append(' '); return s; });
      }
      el._w.forEach((s, i) => { const p = K.eo(K.seg(t, t0 + i * st, t0 + i * st + dur)); s.style.opacity = p; s.style.transform = 'translateX(' + K.lerp(dx, 0, p) + 'px)'; });
      return t0 + (el._w.length - 1) * st + dur;
    },
  };
  window.UI = {
  days(from, to, skip) {
    const out = [], M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], W = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    for (let d = new Date(from + 'T12:00:00Z'); d <= new Date(to + 'T12:00:00Z'); d = new Date(d.getTime() + 864e5)) {
      const iso = d.toISOString().slice(0, 10), wd = d.getUTCDay();
      if (wd === 0 || wd === 6 || (skip || []).includes(iso)) continue;
      out.push({ head: M[d.getUTCMonth()] + ' 2026', num: String(d.getUTCDate()), day: W[wd] });
    }
    return out;
  },
  cal(kit, o) {
    const fs = Math.round(o.h / 2.6);
    const root = kit.h('<div class="cal" style="left:' + o.x + 'px;top:' + o.y + 'px;width:' + o.w + 'px;height:' + o.h + 'px;font-size:' + fs + 'px"></div>');
    for (let i = 2; i >= 1; i--) root.append(kit.h('<div class="cal-sheet" style="transform:translate(' + i * 8 + 'px,' + i * 10 + 'px)"></div>'));
    const mk = () => kit.h('<div class="cal-page"><div class="cal-head"></div><div class="cal-num"></div><div class="cal-day"></div><div class="cal-shade"></div></div>');
    const under = mk(), top = mk();
    root.append(under, top);
    root.append(kit.h('<div class="cal-ring" style="left:28%"></div>'), kit.h('<div class="cal-ring" style="left:68%"></div>'));
    const fill = (el, pg) => { if (el._pg === pg) return; el._pg = pg; el.children[0].textContent = pg.head; el.children[1].textContent = pg.num; el.children[2].textContent = pg.day; };
    const pages = o.pages;
    return {
      el: root,
      set(p) {
        const n = pages.length - 1;
        p = Math.max(0, Math.min(n, p));
        const i = Math.min(n, Math.floor(p)), f = i >= n ? 0 : p - i;
        fill(top, pages[i]); fill(under, pages[Math.min(n, i + 1)]);
        const e = kit.eio(f);
        top.style.transform = 'scaleY(' + (1 - e).toFixed(4) + ') skewX(' + (-6 * Math.sin(Math.PI * e)).toFixed(3) + 'deg)';
        top.style.opacity = f > 0.97 ? 0 : 1;
        top.children[3].style.opacity = (0.25 * e).toFixed(3);
        under.children[3].style.opacity = (0.12 * (1 - e) * (f > 0 ? 1 : 0)).toFixed(3);
      },
    };
  },
  grid(kit, g, o) {
    const out = [];
    for (let i = 1; i <= o.n; i++) { const el = kit.h('<div class="gridl" style="left:' + o.x + 'px;width:' + o.w + 'px;top:' + (o.base - i * o.step) + 'px"></div>'); g.append(el); out.push(el.style); }
    const ax = kit.h('<div class="axis" style="left:' + o.x + 'px;width:' + o.w + 'px;top:' + o.base + 'px"></div>'); g.append(ax); out.unshift(ax.style);
    return (t, t0) => out.forEach((s, i) => { s.transform = 'scaleX(' + kit.eio(kit.seg(t, t0 + i * 0.06, t0 + 0.6 + i * 0.06)) + ')'; });
  },
  draw(path, p) {
    if (!path._len) { path._len = path.getTotalLength(); path.style.strokeDasharray = path._len; }
    path.style.strokeDashoffset = (path._len * (1 - p)).toFixed(2);
  },
  callout(kit, o) {
    const el = kit.h('<div class="callout" style="left:' + o.x + 'px;top:' + o.y + 'px"><div class="callout-k">' + o.k + '</div><div class="callout-v">' + o.v + '</div></div>');
    return { el, render(t, t0) { const a = kit.eob(kit.seg(t, t0, t0 + 0.45), 1.7); el.style.opacity = kit.eo(kit.seg(t, t0, t0 + 0.15)); el.style.transform = 'translateY(' + kit.lerp(24, 0, a) + 'px) scale(' + kit.lerp(0.9, 1, a) + ')'; } };
  },
};
  const SCENES = [
{id:"open",name:"Every month",dur:4,code:function(kit){const { seg, eo, eob, lerp, TextFx } = kit;
kit.scene('open', {
  init(kit) {
    const g = kit.h('<div class="ground"></div>');
    kit.stage.append(g);
    this.words = kit.h('<div class="words" style="left:150px;top:300px;width:900px">' +
      '<p class="tag open-tag">FY2027 · Monthly report</p>' +
      '<h1 class="line">ADRC Executive Dashboard</h1>' +
      '<p class="sub open-sub">Monthly performance on responsiveness, demand and capacity</p></div>');
    g.append(this.words);
    this.rule = kit.h('<div class="rule" style="left:150px;top:820px;width:220px"></div>');
    this.words.append(this.rule); this.rule.style.position='static'; this.rule.style.flex='none';
    this.chart = kit.h('<div style="position:absolute;inset:0"></div>');
    g.append(this.chart);
    this.grid = UI.grid(kit, this.chart, { x: 1150, w: 620, base: 800, step: 110, n: 4 });
    const hs = [450, 450, 300];
    this.bars = hs.map((h, i) => {
      const b = kit.h('<div class="bar' + (i === 2 ? ' now' : '') + '" style="left:' + (1200 + i * 200) + 'px;width:130px;top:' + (800 - h) + 'px;height:' + h + 'px"></div>');
      this.chart.append(b); return b.style;
    });
    this.chart.append(kit.h('<svg class="art" viewBox="0 0 1920 1080"><path class="trace open-trace" style="stroke:var(--accent)" d="M1265 560 C1350 610 1400 640 1465 630 S1600 420 1665 380"/></svg>'));
    this.trace = this.chart.querySelector('.open-trace');
    this.line = this.words.querySelector('.line');
    this.tag = this.words.querySelector('.open-tag').style;
    this.sub = this.words.querySelector('.open-sub').style;
  },
  render(t) {
    this.tag.opacity = eo(seg(t, -0.6, -0.2));
    TextFx.fadeFromRight(this.line, t, -0.55, { stagger: 0.1 });
    this.sub.opacity = eo(seg(t, 0.7, 1.2));
    this.sub.transform = 'translateX(' + lerp(24, 0, eo(seg(t, 0.7, 1.2))) + 'px)';
    this.rule.style.transform = 'scaleX(' + eo(seg(t, 1.0, 1.6)) + ')';
    this.grid(t, -0.4);
    this.bars.forEach((s, i) => { s.transform = 'scaleY(' + eob(seg(t, 0.2 + i * 0.25, 0.85 + i * 0.25), 1.5) + ')'; });
    UI.draw(this.trace, kit.eio(seg(t, 1.3, 2.4)));
    this.chart.style.transform = 'scale(' + (1 + 0.006 * t) + ')';
    this.chart.style.transformOrigin = '1460px 600px';
    this.words.style.transform = 'translateY(' + (-2 * t) + 'px)';
  },
});
}},
{id:"wait",name:"Days to return",dur:5,code:function(kit){const { seg, eo, eio, eob, lerp, TextFx } = kit;
kit.scene('wait', {
  init(kit) {
    const g = kit.h('<div class="ground"></div>');
    kit.stage.append(g);
    this.words = kit.h('<div class="words col"><p class="tag">01 · Days to return a call</p>' +
      '<h2 class="line">How long callers wait</h2>' +
      '<p class="sub wait-sub">Average business days to return a call, by month. Lower is better.</p></div>');
    g.append(this.words);
    this.sub = this.words.querySelector('.wait-sub').style;
    this.grid = UI.grid(kit, g, { x: 780, w: 980, base: 880, step: 110, n: 4 });
    const vals = [['JUL', 9], ['AUG', 9], ['SEP', 6]], k = 55;
    this.bars = vals.map(([m, v], i) => {
      const x = 840 + i * 270, h = v * k;
      const b = kit.h('<div class="bar' + (i === 2 ? ' now' : '') + '" style="left:' + x + 'px;width:180px;top:' + (880 - h) + 'px;height:' + h + 'px"></div>');
      const val = kit.h('<div class="val" style="left:' + x + 'px;width:180px;top:' + (880 - h - 54) + 'px">' + v + '</div>');
      const lab = kit.h('<div class="lab" style="position:absolute;left:' + x + 'px;width:180px;text-align:center;top:905px">' + m + '</div>');
      g.append(b, val, lab);
      return { b: b.style, val: val.style, lab: lab.style };
    });
    this.std = kit.h('<div class="std" style="left:780px;width:980px;top:' + (880 - 2 * k) + 'px"></div>');
    this.stdLab = kit.h('<div class="lab" style="position:absolute;left:1260px;width:500px;text-align:right;top:' + (880 - 2 * k - 40) + 'px;color:var(--second)">DAS standard · 2 days</div>');
    g.append(this.std, this.stdLab);
    g.append(kit.h('<svg class="art" viewBox="0 0 1920 1080"><path class="leader wait-lead" d="M1660 462 Q1620 520 1540 548"/></svg>'));
    this.lead = g.querySelector('.wait-lead');
    this.call = UI.callout(kit, { x: 1580, y: 320, k: 'September', v: '6 days' });
    g.append(this.call.el);
  },
  render(t) {
    TextFx.fadeFromRight(this.words.children[0], t, 0.0);
    TextFx.fadeFromRight(this.words.children[1], t, 0.15);
    this.sub.opacity = eo(seg(t, 0.9, 1.3));
    this.grid(t, 0.3);
    this.bars.forEach((o, i) => {
      const t0 = 0.8 + i * 0.35;
      o.b.transform = 'scaleY(' + eob(seg(t, t0, t0 + 0.65), 1.5) + ')';
      o.val.opacity = eo(seg(t, t0 + 0.5, t0 + 0.8));
      o.lab.opacity = eo(seg(t, 0.5, 0.9));
    });
    this.std.style.transform = 'scaleX(' + eio(seg(t, 2.2, 2.9)) + ')';
    this.stdLab.style.opacity = eo(seg(t, 2.7, 3.1));
    UI.draw(this.lead, eo(seg(t, 3.0, 3.35)));
    this.call.render(t, 3.2);
    this.words.style.transform = 'translateY(' + (-2 * t) + 'px)';
  },
});
}},
{id:"queue",name:"Calls in queue",dur:5,code:function(kit){const { seg, eo, eio, eob, lerp, TextFx } = kit;
kit.scene('queue', {
  init(kit) {
    const g = kit.h('<div class="ground"></div>');
    kit.stage.append(g);
    this.words = kit.h('<div class="words col"><p class="tag">02 · Calls in the queue</p>' +
      '<h2 class="line">Callers still waiting at month-end</h2>' +
      '<p class="sub queue-sub">Callbacks left in the list when each month closed. Lower is better.</p></div>');
    g.append(this.words);
    this.sub = this.words.querySelector('.queue-sub').style;
    this.grid = UI.grid(kit, g, { x: 780, w: 980, base: 880, step: 135, n: 4 });
    const pts = [['JUL', 512, 930], ['AUG', 386, 1270], ['SEP', 1021, 1610]].map(([m, v, x]) => ({ m, v, x, y: Math.round(880 - v * 0.45) }));
    const d = 'M' + pts.map(p => p.x + ' ' + p.y).join(' L');
    g.append(kit.h('<svg class="art" viewBox="0 0 1920 1080"><path class="trace queue-trace" d="' + d + '"/>' +
      pts.map((p, i) => '<circle class="dot' + (i === 2 ? ' now' : '') + ' queue-dot" cx="' + p.x + '" cy="' + p.y + '" r="14"/>').join('') +
      '<path class="leader queue-lead" d="M1440 432 Q1520 400 1588 418"/></svg>'));
    this.trace = g.querySelector('.queue-trace');
    this.lead = g.querySelector('.queue-lead');
    this.dots = [...g.querySelectorAll('.queue-dot')];
    this.dots.forEach((c, i) => { c.style.transformOrigin = pts[i].x + 'px ' + pts[i].y + 'px'; });
    this.labs = pts.map((p, i) => {
      const lab = kit.h('<div class="lab" style="position:absolute;left:' + (p.x - 90) + 'px;width:180px;text-align:center;top:905px">' + p.m + '</div>');
      g.append(lab);
